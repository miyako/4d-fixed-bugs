name: Update dataset

# Refresh of the bug dataset (see UPDATING.md). Runs weekly in "update" mode
# and can also be triggered manually.
#
# Scheduled runs only open a pull request when something other than crawl
# timestamps changed, and are skipped while an earlier dataset-update/* pull
# request is still open (it may be waiting for enrichment or translation).
# With OPENAI_API_KEY (secret) and OPENAI_MODEL (variable) set, update runs also
# write the pending summaries with the model and finish the build themselves.
# Every scheduled run ends by filing a status issue that @mentions the
# repository owner (the "notify" job), with a to-do reminder when work is due.
#
# - mode "update": crawl developer.4d.com/FixedBugsList + sync the 4D-JP notes, rebuild the
#   context, and open a PR. If bugs need English summaries the pipeline stops
#   at the enrichment gate and the PR lists them; write the prose on that
#   branch (merge_enrichment.py), then re-run this workflow on that branch
#   with mode "build-only". The same applies to the Japanese/French translation gate
#   (merge_translation.py) that follows it.
# - mode "build-only": skip crawling and finish the build (link check,
#   embeddings, cache-bust) on the selected branch, committing the result.

on:
  schedule:
    # Mondays 04:17 UTC (off the hour on purpose: scheduled jobs on :00 are delayed).
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        type: choice
        options: [update, build-only]
        default: update
      full_crawl:
        description: Re-probe every version candidate (update mode only)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dataset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip scheduled runs while an update PR is open
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # api.github.com answers 502/503 under load; a skipped guard is not
          # a reason to fail the whole run.
          gh_retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 4 ]; then return 1; fi
              echo "  retrying in $((n * 15))s (attempt $((n + 1))/4): $*" >&2
              sleep $((n * 15)); n=$((n + 1))
            done
          }
          set -uo pipefail
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Not knowing whether a PR is open is not the same as knowing none
            # is: say so and stop, rather than open a second one.
            if ! open=$(gh_retry gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("dataset-update/"))] | length'); then
              echo "::error::api.github.com did not answer; cannot tell whether an update PR is open, so this week's update is skipped."
              exit 1
            fi
            if [ "$open" != "0" ]; then
              echo "An earlier dataset-update PR is still open; skipping this scheduled run."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      automated: ${{ steps.run.outputs.automated }}
      changed: ${{ steps.run.outputs.changed }}
      pending: ${{ steps.run.outputs.pending }}
      pending_ja: ${{ steps.run.outputs.pending_ja }}
      pending_fr: ${{ steps.run.outputs.pending_fr }}
      unresolved: ${{ steps.run.outputs.unresolved }}
      pr_url: ${{ steps.cpr.outputs.pull-request-url || steps.cpr-retry.outputs.pull-request-url }}
    env:
      # Scheduled runs have no inputs: default to a normal incremental update.
      MODE: ${{ inputs.mode || 'update' }}
      FULL_CRAWL: ${{ inputs.full_crawl || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Cache verified search model and runtime
        uses: actions/cache@v4
        # A 5xx from the cache service only costs a re-download, which retries.
        continue-on-error: true
        with:
          path: |
            .cache/search-model
            .cache/search-runtime
          key: search-artifacts-${{ hashFiles('docs/src/search-config.js', 'docs/src/runtime-config.js', 'scripts/package-lock.json') }}

      - name: Unit tests
        run: |
          # The npm registry answers 5xx under load, and here a retry is cheap.
          n=1
          until (cd scripts && npm ci --silent); do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "  npm ci failed; retrying in $((n * 15))s (attempt $((n + 1))/3)" >&2
            sleep $((n * 15)); n=$((n + 1))
          done
          (cd scripts && npm test)

      - name: Run pipeline
        id: run
        env:
          # Optional: with both set, the writing gates are done by the model
          # (scripts/update/automate.py). Without them a person does them.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "build-only" ]; then
            args+=(--build-only)
          elif [ "$FULL_CRAWL" = "true" ]; then
            args+=(--full-crawl)
          fi
          ./scripts/update.sh ${args[@]+"${args[@]}"}

          # Write the pending English / Japanese / French summaries with the
          # model, then finish the build in the same run. Exit codes of
          # automate.py: 0 all written, 3 not configured, 4 partial, 5 nothing pending.
          automated=false
          if [ "$MODE" = "update" ]; then
            rc=0
            python3 scripts/update/automate.py || rc=$?
            case "$rc" in
              0) ./scripts/update.sh --build-only; automated=true ;;
              4) automated=partial ;;
              3|5) ;;
              *) echo "automate.py failed unexpectedly (exit $rc)"; exit "$rc" ;;
            esac
          fi
          echo "automated=$automated" >> "$GITHUB_OUTPUT"

          pending=$(python3 -c "import json;print(len(json.load(open('data/pending_enrichment.json'))))")
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          pending_ja=0
          pending_fr=0
          if [ "$pending" = "0" ] && [ -f data/pending_translation.json ]; then
            pending_ja=$(python3 -c "import json;print(len(json.load(open('data/pending_translation.json'))))")
          fi
          echo "pending_ja=$pending_ja" >> "$GITHUB_OUTPUT"
          if [ "$pending" = "0" ] && [ -f data/pending_translation_fr.json ]; then
            pending_fr=$(python3 -c "import json;print(len(json.load(open('data/pending_translation_fr.json'))))")
          fi
          echo "pending_fr=$pending_fr" >> "$GITHUB_OUTPUT"
          # Listings developer.4d.com would not serve (it is GitHub Pages, and
          # it 503s under load). The crawl keeps their previous data instead of
          # dropping it, so the refresh is still publishable; the count is
          # reported so a run that quietly lost pages is never invisible.
          unresolved=$(python3 -c "import json;s=json.load(open('data/update_state.json'));print(len(s.get('last_crawl',{}).get('unresolved',[])))")
          echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"
          # crawl_log.tsv and update_state.json carry timestamps that change on
          # every crawl. A scheduled run only counts as changed when something
          # else did, so quiet weeks open no pull request.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            real=$(git status --porcelain | awk '{print $2}' | grep -vE '^(crawl_log\.tsv|data/update_state\.json)$' || true)
          else
            real=$(git status --porcelain)
          fi
          if [ -n "$real" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        env:
          AUTOMATED: ${{ steps.run.outputs.automated }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          UNRESOLVED: ${{ steps.run.outputs.unresolved }}
        run: |
          python3 - > "$RUNNER_TEMP/pr_body.md" <<'EOF'
          import json, os
          pending = json.load(open("data/pending_enrichment.json"))
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          print(f"Automated dataset refresh (`{os.environ['MODE']}` mode, [run]({run_url})).\n")
          model = os.environ.get("OPENAI_MODEL", "")
          if os.environ.get("AUTOMATED") == "true":
              print(f"The new summaries in this PR were **written automatically** by an OpenAI model (`{model}`) "
                    "and passed the same validators as hand-written ones. Please skim them before merging: "
                    "nobody proofreads the wording, especially the Japanese and French.\n")
          elif os.environ.get("AUTOMATED") == "partial":
              print(f"An OpenAI model (`{model}`) wrote part of the summaries. What it could not write validly "
                    "is still pending and listed below; the run log has the reasons.\n")
          if os.environ.get("UNRESOLVED", "0") not in ("", "0"):
              print(f"**{os.environ['UNRESOLVED']} listing(s) could not be fetched** (developer.4d.com is GitHub "
                    "Pages and 503s under load). Their previous data was carried over unchanged, so nothing is "
                    "lost; the next run re-probes them. The run log lists the pages.\n")
          if pending:
              print(f"**{len(pending)} bug(s) need an English summary before the site can be rebuilt.**\n")
              print("Write them per `scripts/update/ENRICHMENT_PROMPT.md`, merge with "
                    "`python3 scripts/update/merge_enrichment.py <output.json>`, then re-run "
                    "the *Update dataset* workflow on this branch with mode `build-only`.\n")
              print("| Reference | Reason | Versions | Raw summary |")
              print("|---|---|---|---|")
              for b in pending:
                  s = b["raw_summary"].replace("|", "\\|").replace("\n", " ")
                  print(f"| {b['reference']} | {b['reason']} | {', '.join(b['versions'])} | {s} |")
          else:
              total = 0
              for lang, name, suffix in (("ja", "Japanese", ""), ("fr", "French", "_fr")):
                  path = f"data/pending_translation{suffix}.json"
                  translations = json.load(open(path)) if os.path.exists(path) else []
                  total += len(translations)
                  if not translations:
                      continue
                  prompt = "TRANSLATION_PROMPT_FR.md" if lang == "fr" else "TRANSLATION_PROMPT.md"
                  print(f"**{len(translations)} bug(s) need a {name} summary before the site can be rebuilt.**\n")
                  print(f"Split them with `python3 scripts/update/split_pending.py --kind translation --lang {lang}`, write "
                        f"each chunk per `scripts/update/{prompt}`, merge with "
                        f"`python3 scripts/update/merge_translation.py --lang {lang} <chunk.out.json> --partial`, then re-run "
                        "the *Update dataset* workflow on this branch with mode `build-only`.\n")
                  print("| Reference | Reason |")
                  print("|---|---|")
                  for b in translations:
                      print(f"| {b['reference']} | {b['reason']} |")
                  print()
              if not total:
                  print("No enrichment or translation pending; site data has been rebuilt.")
          EOF
          cat "$RUNNER_TEMP/pr_body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to current branch (build-only)
        if: steps.run.outputs.changed == 'true' && env.MODE == 'build-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site data"
          # A 502/503 from github.com must not cost a full rebuild.
          n=1
          until git push; do
            if [ "$n" -ge 4 ]; then exit 1; fi
            echo "  push failed; retrying in $((n * 20))s (attempt $((n + 1))/4)" >&2
            sleep $((n * 20)); n=$((n + 1))
          done

      - name: Open pull request (update)
        id: cpr
        if: steps.run.outputs.changed == 'true' && env.MODE == 'update'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: dataset-update/${{ github.run_id }}
          commit-message: Update dataset from developer.4d.com/FixedBugsList and 4D-JP notes
          title: >-
            Update dataset${{ steps.run.outputs.pending != '0' && format(' ({0} bugs pending enrichment)', steps.run.outputs.pending) || ((steps.run.outputs.pending_ja != '0' || steps.run.outputs.pending_fr != '0') && format(' (JA: {0}, FR: {1} pending translation)', steps.run.outputs.pending_ja, steps.run.outputs.pending_fr)) || '' }}
          body-path: ${{ runner.temp }}/pr_body.md
          delete-branch: true

      # The first attempt died, most likely on a 5xx from api.github.com. The
      # branch and the built data are still in the workspace, so a second
      # attempt costs seconds — re-creating the PR finds the branch and only
      # re-does the API call.
      - name: Wait before retrying the pull request (GitHub 5xx)
        if: steps.run.outputs.changed == 'true' && env.MODE == 'update' && steps.cpr.outcome == 'failure'
        run: sleep 90

      - name: Open pull request (update, retry)
        id: cpr-retry
        if: steps.run.outputs.changed == 'true' && env.MODE == 'update' && steps.cpr.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: dataset-update/${{ github.run_id }}
          commit-message: Update dataset from developer.4d.com/FixedBugsList and 4D-JP notes
          title: >-
            Update dataset${{ steps.run.outputs.pending != '0' && format(' ({0} bugs pending enrichment)', steps.run.outputs.pending) || ((steps.run.outputs.pending_ja != '0' || steps.run.outputs.pending_fr != '0') && format(' (JA: {0}, FR: {1} pending translation)', steps.run.outputs.pending_ja, steps.run.outputs.pending_fr)) || '' }}
          body-path: ${{ runner.temp }}/pr_body.md
          delete-branch: true

  # After every scheduled run, tell the repository owner what happened: an issue
  # that @mentions them triggers their normal GitHub notification (and email).
  # It carries a status report and, when a PR was opened or is still open, a
  # reminder of the manual steps. Quiet weeks and skipped runs are filed and
  # closed straight away so they notify without leaving open items behind.
  notify:
    needs: [guard, update]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      SKIPPED: ${{ needs.guard.outputs.skip }}
      GUARD_RESULT: ${{ needs.guard.result }}
      RESULT: ${{ needs.update.result }}
      CHANGED: ${{ needs.update.outputs.changed }}
      PENDING: ${{ needs.update.outputs.pending }}
      PENDING_JA: ${{ needs.update.outputs.pending_ja }}
      PENDING_FR: ${{ needs.update.outputs.pending_fr }}
      UNRESOLVED: ${{ needs.update.outputs.unresolved }}
      PR_URL: ${{ needs.update.outputs.pr_url }}
      AUTOMATED: ${{ needs.update.outputs.automated }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report status
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          close_after=false
          body="$RUNNER_TEMP/body.md"
          # api.github.com answers 502/503 under load; the status issue is the
          # only notification the owner gets, so it is worth retrying.
          gh_retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 4 ]; then return 1; fi
              echo "  retrying in $((n * 20))s (attempt $((n + 1))/4): $*" >&2
              sleep $((n * 20)); n=$((n + 1))
            done
          }
          open_prs=$(gh_retry gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,url,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("dataset-update/"))] | map("- " + .url) | join("\n")')

          if [ "$SKIPPED" = "true" ]; then
            status="skipped, an earlier update PR is still open"
            close_after=true
            {
              echo "@$OWNER The weekly dataset update was **skipped** because an earlier update pull request is still open:"
              echo
              echo "$open_prs"
              echo
              echo "Reminder: finish that PR first (see the checklist below), then merge it. The next scheduled run will pick up from there."
            } > "$body"
            remind=true
          elif [ "${GUARD_RESULT:-}" = "failure" ]; then
            status="FAILED (could not check for open PRs)"
            {
              echo "@$OWNER The weekly dataset update did **not run**: GitHub did not answer when the run checked for open update pull requests, so it could not safely decide whether to start one."
              echo
              echo "Nothing is wrong with the dataset. Logs: $RUN_URL"
            } > "$body"
            remind=false
          elif [ "$RESULT" != "success" ]; then
            status="FAILED"
            {
              echo "@$OWNER The weekly dataset update **failed** (job result: \`$RESULT\`)."
              echo
              echo "Logs: $RUN_URL"
            } > "$body"
            remind=false
          elif [ "$CHANGED" != "true" ]; then
            status="no new fixes"
            close_after=true
            {
              if [ -n "${UNRESOLVED:-}" ] && [ "$UNRESOLVED" != "0" ]; then
                echo "@$OWNER The weekly dataset update ran and found **nothing new** on the pages it could read, so no pull request was opened."
              else
                echo "@$OWNER The weekly dataset update ran and found **nothing new** on developer.4d.com, so no pull request was opened."
              fi
              echo
              echo "Run: $RUN_URL"
            } > "$body"
            remind=false
          elif [ "${AUTOMATED:-false}" = "true" ]; then
            status="update PR ready for review"
            {
              echo "@$OWNER The weekly dataset update found changes, **wrote the English, Japanese and French summaries automatically**, rebuilt the site data and opened a pull request: ${PR_URL:-see the run}"
              echo
              echo "Run: $RUN_URL"
              echo
              echo "### To do"
              echo "1. Skim the new summaries in the PR. They passed the validators, but nobody proofreads the wording, especially the Japanese and French."
              echo "2. Merge the PR to publish."
            } > "$body"
            remind=false
          else
            status="update PR opened"
            {
              echo "@$OWNER The weekly dataset update found changes and opened a pull request: ${PR_URL:-see the run}"
              echo
              if [ "${AUTOMATED:-false}" = "partial" ]; then
                echo "The automatic writing could not finish everything; what is left is listed in the PR."
                echo
              fi
              echo "- English summaries pending: **${PENDING:-0}**"
              if [ "${PENDING:-0}" != "0" ]; then
                echo "- Japanese and French: queued once the English summaries are merged"
              else
                echo "- Japanese summaries pending: **${PENDING_JA:-0}**"
                echo "- French summaries pending: **${PENDING_FR:-0}**"
              fi
              echo
              echo "Run: $RUN_URL"
            } > "$body"
            remind=true
          fi

          # A run that lost pages has to say so: "nothing new" is only true of
          # the pages that answered.
          if [ -n "${UNRESOLVED:-}" ] && [ "$UNRESOLVED" != "0" ]; then
            {
              echo
              echo "**${UNRESOLVED} listing(s) could not be fetched** this run (developer.4d.com is GitHub Pages and 503s under load). Their previous data was kept, so nothing was dropped; the next crawl re-probes them. The run log names the pages."
            } >> "$body"
          fi

          if [ "$remind" = "true" ]; then
            {
              echo
              echo "### To do before the site is published"
              echo "1. **Enrich the English summaries** listed in the PR (\`scripts/update/ENRICHMENT_PROMPT.md\`), then merge them with \`merge_enrichment.py\`."
              echo "2. **Complete the Japanese and French translations** (\`TRANSLATION_PROMPT.md\` / \`TRANSLATION_PROMPT_FR.md\`), then merge them with \`merge_translation.py\`."
              echo "3. Push to the PR branch and run the *Update dataset* workflow on it with mode \`build-only\`."
              echo "4. Review and merge the PR."
              echo
              echo "Details: UPDATING.md in the repository."
            } >> "$body"
          fi

          url=$(gh_retry gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "Weekly dataset update $today: $status" \
                  --body-file "$body")
          echo "$url"
          if [ "$close_after" = "true" ]; then
            gh_retry gh issue close "$url" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
